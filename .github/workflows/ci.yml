name: CI

on:
  push:
    branches: [main, cleanup]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deps:
    name: Dependency locks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
            locks/python.lock
      - name: Verify dependency locks
        run: python scripts/verify_dep_locks.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -e ".[forge,dev]"
      - name: Run lint
        run: python scripts/run_ci_local.py --job lint --skip-install

  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-py310-${{ hashFiles('pyproject.toml', 'scripts/mypy-baseline.txt') }}
          restore-keys: |
            mypy-${{ runner.os }}-py310-
      - name: Install dependencies
        run: python -m pip install -e ".[forge,train,dev]"
      - name: Run Mypy
        run: python scripts/run_ci_local.py --job types --skip-install

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -e ".[forge,train,dev]"
      - name: Run CPU tests
        run: python scripts/run_ci_local.py --job test --pytest-workers 2 --skip-install

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
            locks/python.lock
      - name: Install dependencies
        run: python -m pip install -e ".[forge,train,dev]"
      - name: Run security checks
        run: python scripts/run_ci_local.py --job security --skip-install

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: forge-ui/package-lock.json
      - name: Run frontend checks
        working-directory: forge-ui
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build

  quality:
    name: Quality gate
    if: always()
    needs: [deps, lint, types, tests, security, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a required job did not pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - name: Confirm required jobs passed
        run: echo "All required quality jobs passed."

  slow-tests:
    name: Slow integration tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -e ".[forge,train,dev]"
      - name: Run slow tests
        run: python -m pytest tests/ -q -m "slow and not gpu"
