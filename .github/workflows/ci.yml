name: CI

on:
  push:
    branches: [main, cleanup]
  pull_request:
  # Manual recovery when a stuck re-run holds the PR concurrency slot.
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

# Include the head SHA for pull_request / workflow_dispatch so a limbo re-run of
# an older commit cannot block CI for newer commits on the same PR ref.
concurrency:
  group: >-
    ci-${{ github.workflow }}-${{
      github.event.pull_request.number
      || github.ref
    }}-${{ github.sha }}
  cancel-in-progress: true

env:
  UV_TORCH_BACKEND: cpu
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.select.outputs.python }}
      frontend: ${{ steps.select.outputs.frontend }}
    steps:
      # Prefer git path detection over dorny/paths-filter: the latter calls the
      # GitHub API and can fail with unicorn/5xx pages, skipping the whole matrix.
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - id: select
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if ! files=$(git diff --name-only "${base}...${head}" 2>/dev/null); then
            echo "git diff failed; running full matrix" >&2
            echo "python=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python=false
          frontend=false
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              seiso/*|forge/*|seiso_cli/*|tests/*|configs/*|scripts/*|docs/*|locks/*|pyproject.toml|Makefile|.secrets.baseline|.github/workflows/ci.yml)
                python=true
                ;;
              requirements*.txt|*.md)
                python=true
                ;;
            esac
            # Nested markdown / requirements (bash case * does not cross '/').
            case "$path" in
              */*.md|*/*/*.md|*/requirements*.txt)
                python=true
                ;;
            esac
            case "$path" in
              forge-ui/*|.github/workflows/ci.yml)
                frontend=true
                ;;
            esac
          done <<< "$files"
          # Empty or unreadable diffs still run Python jobs so quality gate cannot soft-skip.
          if [ -z "$files" ]; then
            python=true
          fi
          echo "python=${python}" >> "$GITHUB_OUTPUT"
          echo "frontend=${frontend}" >> "$GITHUB_OUTPUT"
          echo "Changed files (truncated):" >&2
          echo "$files" | head -40 >&2

  deps:
    name: Dependency locks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
          enable-cache: true
          activate-environment: true
          cache-dependency-glob: |
            pyproject.toml
            locks/python.lock
      - name: Install lock verification helpers
        run: uv pip install tomli packaging
      - name: Verify dependency locks
        run: python scripts/verify_dep_locks.py
      - name: Verify Python lock freshness
        # Constrained recompile (no --upgrade): fails if pyproject needs pins
        # outside locks/python.lock. Refresh with scripts/update_dep_locks.py.
        run: python scripts/check_python_lock_freshness.py

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
          enable-cache: true
          activate-environment: true
          cache-dependency-glob: |
            pyproject.toml
            requirements-dev.txt
            locks/python.lock
      - name: Install locked dependencies
        # UV_TORCH_BACKEND=cpu skips CUDA wheels that GitHub runners cannot use.
        # Use uv pip (venv may not ship the pip module).
        run: python scripts/install_locked_deps.py --editable
      - name: Run lint
        run: python scripts/run_ci_local.py --job lint --skip-install

  types:
    name: Types
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
          enable-cache: true
          activate-environment: true
          cache-dependency-glob: |
            pyproject.toml
            requirements-dev.txt
            locks/python.lock
      - uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-py310-${{ hashFiles('pyproject.toml', 'scripts/mypy-baseline.txt') }}
          restore-keys: |
            mypy-${{ runner.os }}-py310-
      - name: Install locked dependencies
        run: python scripts/install_locked_deps.py --editable
      - name: Run Mypy
        run: python scripts/run_ci_local.py --job types --skip-install

  tests:
    name: Tests
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
          enable-cache: true
          activate-environment: true
          cache-dependency-glob: |
            pyproject.toml
            requirements-dev.txt
            locks/python.lock
      - name: Install locked dependencies
        run: python scripts/install_locked_deps.py --editable
      - name: Run CPU tests
        run: >
          python scripts/run_ci_local.py
          --job test
          --pytest-workers auto
          --pytest-dist worksteal
          --skip-install

  security:
    name: Security
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
          enable-cache: true
          activate-environment: true
          cache-dependency-glob: |
            pyproject.toml
            requirements-dev.txt
            locks/python.lock
      - name: Install locked dependencies
        # Hashed lock resolve (forge+train+dev), not a fresh PyPI solve.
        # UV_TORCH_BACKEND=cpu skips CUDA wheels that GitHub runners cannot use.
        run: python scripts/install_locked_deps.py --editable
      - name: Run security checks
        run: python scripts/run_ci_local.py --job security --skip-install

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: forge-ui/package-lock.json
      - name: Run frontend checks
        working-directory: forge-ui
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build

  quality:
    name: Quality gate
    if: always()
    needs: [changes, deps, lint, types, tests, security, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a required job did not pass
        env:
          CHANGES: ${{ needs.changes.result }}
          DEPS: ${{ needs.deps.result }}
          LINT: ${{ needs.lint.result }}
          TYPES: ${{ needs.types.result }}
          TESTS: ${{ needs.tests.result }}
          SECURITY: ${{ needs.security.result }}
          FRONTEND: ${{ needs.frontend.result }}
          PYTHON: ${{ needs.changes.outputs.python }}
          FRONTEND_NEEDED: ${{ needs.changes.outputs.frontend }}
        run: |
          set -euo pipefail
          failed=0
          check() {
            local name="$1" result="$2" required="$3"
            if [ "$required" != "true" ]; then
              echo "$name=$result (not required)"
              return 0
            fi
            if [ "$result" = "success" ]; then
              echo "$name=$result"
              return 0
            fi
            echo "$name=$result (required)"
            failed=1
          }
          check changes "$CHANGES" true
          check deps "$DEPS" true
          check lint "$LINT" "$PYTHON"
          check types "$TYPES" "$PYTHON"
          check tests "$TESTS" "$PYTHON"
          check security "$SECURITY" "$PYTHON"
          check frontend "$FRONTEND" "$FRONTEND_NEEDED"
          exit "$failed"
      - name: Confirm required jobs passed
        run: echo "All required quality jobs passed."

  slow-tests:
    name: Slow integration tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
          enable-cache: true
          activate-environment: true
          cache-dependency-glob: |
            pyproject.toml
            requirements-dev.txt
            locks/python.lock
      - name: Install locked dependencies
        run: python scripts/install_locked_deps.py --editable
      - name: Run slow tests
        run: python -m pytest tests/ -q -m "slow and not gpu" -n auto --dist worksteal

  live-check:
    name: Live Forge frontend/backend check
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
          enable-cache: true
          activate-environment: true
          cache-dependency-glob: |
            pyproject.toml
            requirements-dev.txt
            locks/python.lock
      - name: Install locked dependencies
        run: python scripts/install_locked_deps.py --editable
      - name: Start Forge and run live-check
        env:
          SEISO_DATA_DIR: ${{ runner.temp }}/seiso-live
          SEISO_SECRET_KEY: ci-live-check-secret-key-32bytes!!
          SEISO_ALLOW_TINY_RL: "1"
        run: |
          mkdir -p "$SEISO_DATA_DIR"
          uvicorn forge.main:create_app --factory --host 127.0.0.1 --port 8765 &
          FORGE_PID=$!
          cleanup() { kill "$FORGE_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8765/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8765/health
          python scripts/live_frontend_backend_check.py
