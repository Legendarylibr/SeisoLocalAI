name: CI

on:
  push:
    branches: [main, cleanup]
  pull_request:
  # Manual recovery when a stuck re-run holds the PR concurrency slot.
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

# Include the head SHA for pull_request / workflow_dispatch so a limbo re-run of
# an older commit cannot block CI for newer commits on the same PR ref.
concurrency:
  group: >-
    ci-${{ github.workflow }}-${{
      github.event.pull_request.number
      || github.ref
    }}-${{ github.sha }}
  cancel-in-progress: true

env:
  UV_TORCH_BACKEND: cpu
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.select.outputs.python }}
      frontend: ${{ steps.select.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            python:
              - 'seiso/**'
              - 'forge/**'
              - 'seiso_cli/**'
              - 'tests/**'
              - 'configs/**'
              - 'scripts/**'
              - 'docs/**'
              - 'locks/**'
              - 'pyproject.toml'
              - 'requirements*.txt'
              - 'Makefile'
              - '*.md'
              - '.secrets.baseline'
              - '.github/workflows/ci.yml'
            frontend:
              - 'forge-ui/**'
              - '.github/workflows/ci.yml'
      - id: select
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python="${{ steps.filter.outputs.python }}"
          frontend="${{ steps.filter.outputs.frontend }}"
          echo "python=${python:-false}" >> "$GITHUB_OUTPUT"
          echo "frontend=${frontend:-false}" >> "$GITHUB_OUTPUT"

  deps:
    name: Dependency locks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Verify dependency locks
        run: python scripts/verify_dep_locks.py

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
          enable-cache: true
          activate-environment: true
          cache-dependency-glob: |
            pyproject.toml
            requirements-dev.txt
            locks/python.lock
      - name: Install dependencies
        run: uv pip install -e ".[forge,dev]"
      - name: Run lint
        run: python scripts/run_ci_local.py --job lint --skip-install

  types:
    name: Types
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
          enable-cache: true
          activate-environment: true
          cache-dependency-glob: |
            pyproject.toml
            requirements-dev.txt
            locks/python.lock
      - uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-py310-${{ hashFiles('pyproject.toml', 'scripts/mypy-baseline.txt') }}
          restore-keys: |
            mypy-${{ runner.os }}-py310-
      - name: Install dependencies
        run: uv pip install -e ".[forge,train,dev]"
      - name: Run Mypy
        run: python scripts/run_ci_local.py --job types --skip-install

  tests:
    name: Tests
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
          enable-cache: true
          activate-environment: true
          cache-dependency-glob: |
            pyproject.toml
            requirements-dev.txt
            locks/python.lock
      - name: Install dependencies
        run: uv pip install -e ".[forge,train,dev]"
      - name: Run CPU tests
        run: >
          python scripts/run_ci_local.py
          --job test
          --pytest-workers auto
          --pytest-dist worksteal
          --skip-install

  security:
    name: Security
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
          enable-cache: true
          activate-environment: true
          cache-dependency-glob: |
            pyproject.toml
            requirements-dev.txt
            locks/python.lock
      - name: Install dependencies
        # Train extras included for pip-audit coverage; UV_TORCH_BACKEND=cpu
        # skips CUDA wheels that GitHub runners cannot use.
        run: uv pip install -e ".[forge,train,dev]"
      - name: Run security checks
        run: python scripts/run_ci_local.py --job security --skip-install

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: forge-ui/package-lock.json
      - name: Run frontend checks
        working-directory: forge-ui
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build

  quality:
    name: Quality gate
    if: always()
    needs: [changes, deps, lint, types, tests, security, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a required job did not pass
        env:
          CHANGES: ${{ needs.changes.result }}
          DEPS: ${{ needs.deps.result }}
          LINT: ${{ needs.lint.result }}
          TYPES: ${{ needs.types.result }}
          TESTS: ${{ needs.tests.result }}
          SECURITY: ${{ needs.security.result }}
          FRONTEND: ${{ needs.frontend.result }}
          PYTHON: ${{ needs.changes.outputs.python }}
          FRONTEND_NEEDED: ${{ needs.changes.outputs.frontend }}
        run: |
          set -euo pipefail
          failed=0
          check() {
            local name="$1" result="$2" required="$3"
            if [ "$required" != "true" ]; then
              echo "$name=$result (not required)"
              return 0
            fi
            if [ "$result" = "success" ]; then
              echo "$name=$result"
              return 0
            fi
            echo "$name=$result (required)"
            failed=1
          }
          check changes "$CHANGES" true
          check deps "$DEPS" true
          check lint "$LINT" "$PYTHON"
          check types "$TYPES" "$PYTHON"
          check tests "$TESTS" "$PYTHON"
          check security "$SECURITY" "$PYTHON"
          check frontend "$FRONTEND" "$FRONTEND_NEEDED"
          exit "$failed"
      - name: Confirm required jobs passed
        run: echo "All required quality jobs passed."

  slow-tests:
    name: Slow integration tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
          enable-cache: true
          activate-environment: true
          cache-dependency-glob: |
            pyproject.toml
            requirements-dev.txt
            locks/python.lock
      - name: Install dependencies
        run: uv pip install -e ".[forge,train,dev]"
      - name: Run slow tests
        run: python -m pytest tests/ -q -m "slow and not gpu" -n auto --dist worksteal
