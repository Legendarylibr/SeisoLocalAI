name: CI

on:
  push:
    branches: [main, cleanup]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: forge-ui/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[forge,train,dev]"
          pip install -r requirements-dev.txt

      - name: Run fast quality gate
        run: make ci-fast

      - name: Run frontend checks
        working-directory: forge-ui
        run: |
          npm ci
          npm run typecheck
          npm run build
