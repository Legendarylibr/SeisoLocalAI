name: Rust

on:
  push:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "python/seiso_ml_worker/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "python/seiso_ml_worker/**"
      - ".github/workflows/rust.yml"

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo:
    name: cargo fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (unit + e2e)
        run: cargo test --workspace -- --nocapture
        env:
          RUST_BACKTRACE: "1"

      - name: Python worker smoke
        run: |
          echo '{"v":1,"op":"train.start","job_id":"ci","config":{"smoke_only":true},"paths":{}}' \
            | PYTHONPATH=python python3 -m seiso_ml_worker
          echo '{"v":1,"op":"export.start","job_id":"ci-exp","config":{"smoke_only":true},"paths":{"data_dir":"/tmp/seiso-ci-export"}}' \
            | PYTHONPATH=python python3 -m seiso_ml_worker

      - name: Shell E2E against seiso-forge binary
        run: bash scripts/e2e_rust_forge.sh
