# Dependabot tracks declared deps in pyproject.toml / forge-ui.
# Canonical Python lock is locks/python.lock (hashed; refresh via
# python scripts/update_dep_locks.py). Do not commit uv.lock — a stale
# committed copy previously produced ghost Dependabot alerts (nltk/pyasn1)
# after the file was removed from main.
#
# npm PRs: workflow dependabot-digests.yml regenerates forge-ui/bun.lock and
# refreshes locks/digests.json from the updated package-lock.json. pip PRs
# that change resolved versions still need a full
# `python scripts/update_dep_locks.py` (recompile) before merge.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: /forge-ui
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
