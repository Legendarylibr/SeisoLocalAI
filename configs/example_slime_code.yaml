# Product slime code GRPO — shape template (paths must exist before train).
# Replace dataset/eval with real verifiable code JSONL (prompt + tests).
# Validate fails until files exist (or SEISO_ALLOW_TEMPLATE_SLIME=1).
# CI toys: data/slime_code_*.jsonl via SEISO_ALLOW_TINY_RL=1.
model_id: Qwen/Qwen2.5-0.5B-Instruct
method: slime
# slime path uses full-precision (+ optional LoRA); quant ignored by slime runner
quant: none
# REQUIRED: create these (or point at your train/eval JSONL).
dataset: ./data/operator_code_train.jsonl
eval_dataset: ./data/operator_code_eval.jsonl
require_held_out_eval: true
eval_on_complete: true
eval_every_steps: 0
eval_max_prompts: null
output_dir: outputs/slime-code
prompt_field: prompt
answer_field: answer
reward: code
# binary = all unit tests must pass (default). dense = pass fraction.
# auto = dense until a same-prompt group has a full passer, then binary.
code_reward_mode: binary
max_vram_gb: 16
max_prompt_tokens: 512
max_new_tokens: 256
rollouts_per_prompt: 4
rollout_batch_size: 4
dynamic_sampling_filter: reward_nonzero_std
over_sampling_batch_size: 8
# Keep intact GRPO groups: must be a multiple of rollouts_per_prompt.
policy_micro_batch_size: 4
train_batch_size: 1
shuffle_buffer_size: 128
gradient_accumulation_steps: 8
learning_rate: 0.000005
max_grad_norm: 1.0
epochs: 1
# 0 = no frozen ref (lower VRAM). Use ~0.02–0.05 for longer runs to limit drift.
kl_coef: 0.0
clip_ratio: 0.2
clip_ratio_high: 0.28
grpo_std_normalization: true
temperature: 0.9
top_p: 0.95
# Code proofs do not need thinking format by default.
require_thinking_trace: false
outcome_reward_weight: 1.0
format_reward_weight: 0.0
process_reward_weight: 0.0
missing_thinking_penalty: 0.0
gradient_checkpointing: true
use_lora: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
save_every_steps: 100
log_every_steps: 1
best_checkpoint_dir: checkpoint-best
auto_stop: true
auto_stop_metric: outcome_reward_mean
auto_stop_patience: 20
write_verifier_data: true
verifier_data_file: slime_verifier_data.jsonl
data_gen: false
data_gen_source: "off"
data_designer: "off"
