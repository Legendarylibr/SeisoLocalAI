model_id: Qwen/Qwen2.5-0.5B-Instruct
dataset: data/slime_code_sample.jsonl
output_dir: outputs/slime-code
prompt_field: prompt
answer_field: answer
reward: code
max_vram_gb: 16
max_prompt_tokens: 512
max_new_tokens: 256
rollouts_per_prompt: 4
rollout_batch_size: 4
policy_micro_batch_size: 2
train_batch_size: 1
shuffle_buffer_size: 128
gradient_accumulation_steps: 8
learning_rate: 0.000005
max_grad_norm: 1.0
epochs: 1
kl_coef: 0.0
clip_ratio: 0.2
temperature: 0.9
top_p: 0.95
# Code proofs do not need thinking format by default.
require_thinking_trace: false
outcome_reward_weight: 1.0
format_reward_weight: 0.0
process_reward_weight: 0.0
missing_thinking_penalty: 0.0
gradient_checkpointing: true
use_lora: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
save_every_steps: 100
log_every_steps: 1
best_checkpoint_dir: checkpoint-best
auto_stop: true
auto_stop_metric: reward_mean
auto_stop_patience: 20
write_verifier_data: true
verifier_data_file: slime_verifier_data.jsonl
