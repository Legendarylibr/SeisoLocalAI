# Multi-GPU: vLLM for generate (tensor-parallel), Accelerate DDP for policy update.
# Launch vLLM first (enable LoRA for adapter weight sync — recommended with slime_use_lora):
#   python -m vllm.entrypoints.openai.api_server \
#     --model Qwen/Qwen2.5-0.5B-Instruct --port 8000 \
#     --tensor-parallel-size 2 --enable-lora
# Or Seiso managed multi-GPU:
#   SEISO_MANAGED_VLLM_ENABLED=true SEISO_MANAGED_VLLM_ENABLE_LORA=true \
#   SEISO_MANAGED_VLLM_MODEL=Qwen/Qwen2.5-0.5B-Instruct seiso forge
#   then set vllm_base_url to the managed base (http://127.0.0.1:8000).
model_id: Qwen/Qwen2.5-0.5B-Instruct
# Replace fixtures with curated verifiable train/eval (OpenR1-style / operator JSONL).
dataset: data/slime_sample.jsonl
eval_dataset: data/slime_numeric_eval.jsonl
require_held_out_eval: true
output_dir: outputs/slime-train-vllm
method: slime
# slime path loads full-precision (+ optional LoRA); quant is ignored by this trainer
quant: none
training_methodology: seiso_release_post_training
prompt_field: prompt
answer_field: answer
metadata_field: metadata
reward: auto
max_vram_gb: 16
max_prompt_tokens: 512
max_new_tokens: 128
rollouts_per_prompt: 4
rollout_batch_size: 4
dynamic_sampling_filter: reward_nonzero_std
over_sampling_batch_size: 8
policy_micro_batch_size: 2
batch_size: 1
train_batch_size: null
shuffle_buffer_size: 128
balance_data: true
gradient_accumulation_steps: 8
learning_rate: 0.000005
max_grad_norm: 1.0
epochs: 1
kl_coef: 0.0
clip_ratio: 0.2
clip_ratio_high: 0.28
grpo_std_normalization: true
temperature: 0.9
top_p: 0.95
# Multi-GPU rollouts through the vLLM OpenAI-compatible server
rollout_backend: vllm
vllm_base_url: "http://127.0.0.1:8000"
vllm_model: ""
vllm_api_key: "EMPTY"
vllm_timeout_s: 120
vllm_max_workers: 8
# After each optimizer step: export adapter + hot-reload via /v1/load_lora_adapter
vllm_sync_weights: true
vllm_weight_dir: vllm_weight_sync
vllm_weight_mode: auto   # auto | lora | full
vllm_weight_keep: 2
vllm_lora_name: seiso_slime_policy
# Optional extra engines (or comma-separate vllm_base_url):
# vllm_engine_urls: ["http://127.0.0.1:8001"]
apply_chat_template: true
require_thinking_trace: true
thinking_instruction: "Show your reasoning in <think>...</think>, then give the final answer."
outcome_reward_weight: 1.0
format_reward_weight: 0.1
process_reward_weight: 0.0
missing_thinking_penalty: 0.0
min_thinking_tokens: 8
gradient_checkpointing: true
slime_use_lora: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
use_8bit_optimizer: false
save_steps: 100
logging_steps: 1
best_checkpoint_dir: checkpoint-best
auto_stop: true
auto_stop_metric: reward_mean
auto_stop_patience: 20
auto_stop_min_delta: 0.0001
auto_stop_warmup_steps: 10
stop_on_nonfinite: true
write_verifier_data: true
verifier_data_file: slime_verifier_data.jsonl
verifier_max_text_chars: 2048
data_gen: false
data_gen_source: "off"
data_designer: "off"
# Opt-in synth: data_gen_source=hf_dataset|data_designer (DD needs package + live endpoint).
# Optional TP size hint when training is single-process but vLLM uses multi-GPU:
# vllm_tensor_parallel: 2
