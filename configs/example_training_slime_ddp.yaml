# Multi-GPU: SGLang for generate (slime-like), Accelerate DDP for policy update.
# Launch SGLang first:
#   python -m sglang.launch_server --model-path Qwen/Qwen2.5-0.5B-Instruct --port 30000
model_id: Qwen/Qwen2.5-0.5B-Instruct
dataset: data/slime_sample.jsonl
output_dir: outputs/slime-train-ddp
method: slime
quant: 4bit
training_methodology: seiso_release_post_training
prompt_field: prompt
answer_field: label
metadata_field: metadata
reward: auto
max_vram_gb: 16
max_prompt_tokens: 512
max_new_tokens: 128
rollouts_per_prompt: 4
rollout_batch_size: 4
dynamic_sampling_filter: reward_nonzero_std
over_sampling_batch_size: 8
policy_micro_batch_size: 2
batch_size: 1
train_batch_size: null
shuffle_buffer_size: 128
balance_data: true
gradient_accumulation_steps: 8
learning_rate: 0.000005
max_grad_norm: 1.0
epochs: 1
kl_coef: 0.0
clip_ratio: 0.2
clip_ratio_high: 0.28
grpo_std_normalization: true
temperature: 0.9
top_p: 0.95
rollout_backend: sglang
sglang_base_url: "http://127.0.0.1:30000"
sglang_model: ""
sglang_api_key: "EMPTY"
sglang_timeout_s: 120
sglang_max_workers: 8
# After each optimizer step: write HF weights + POST /update_weights_from_disk
sglang_sync_weights: true
sglang_weight_dir: sglang_weight_sync
apply_chat_template: true
require_thinking_trace: true
thinking_instruction: "Show your reasoning in <think>...</think>, then give the final answer."
outcome_reward_weight: 1.0
format_reward_weight: 0.1
process_reward_weight: 0.0
missing_thinking_penalty: 0.5
min_thinking_tokens: 8
gradient_checkpointing: true
slime_use_lora: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
use_8bit_optimizer: false
save_steps: 100
logging_steps: 1
best_checkpoint_dir: checkpoint-best
auto_stop: true
auto_stop_metric: reward_mean
auto_stop_patience: 20
auto_stop_min_delta: 0.0001
auto_stop_warmup_steps: 10
stop_on_nonfinite: true
write_verifier_data: true
verifier_data_file: slime_verifier_data.jsonl
verifier_max_text_chars: 2048
data_gen: true
data_gen_count: 800
data_gen_seed: 17
data_gen_mix: "numeric:0.55,choice:0.15,code:0.30"
data_gen_difficulty: "easy:0.3,medium:0.45,hard:0.25"
data_gen_filename: slime_generated.jsonl
multi_gpu: true
distributed_strategy: ddp
distributed_nproc_per_node: null
distributed_num_nodes: 1
distributed_node_rank: 0
distributed_master_addr: "127.0.0.1"
distributed_master_port: 29500
