# QLoRA fine-tune (Seiso Core / Forge Train Studio)
model_id: meta-llama/Llama-3.2-3B-Instruct
dataset: ./data/sample.jsonl
output_dir: ./outputs/lora-run
method: lora
quant: 4bit
dataset_format: auto
epochs: 1
