# Single-GPU slime GRPO — Hub materialize (not CI fixtures under data/slime_*.jsonl).
# Smoke/CI toys: configs/smoke_slime_cpu.yaml + SEISO_ALLOW_TINY_RL=1.
model_id: Qwen/Qwen2.5-0.5B-Instruct
method: slime
# slime path uses full-precision (+ optional LoRA); quant ignored by slime runner
quant: none
dataset: open-r1/OpenR1-Math-220k
require_held_out_eval: true
output_dir: outputs/slime-single-gpu
# slime --input-key / --label-key / --metadata-key
prompt_field: prompt
answer_field: answer
metadata_field: metadata
# slime --rm-type (per-row metadata.rm_type when auto)
reward: auto
max_vram_gb: 16
max_prompt_tokens: 512
max_new_tokens: 128
# slime --n-samples-per-prompt
rollouts_per_prompt: 4
# slime --rollout-batch-size (prompts)
rollout_batch_size: 2
# slime --over-sampling-batch-size (>= rollout_batch_size)
over_sampling_batch_size: 4
dynamic_sampling_filter: reward_nonzero_std
# Keep intact GRPO groups: must be a multiple of rollouts_per_prompt.
policy_micro_batch_size: 4
# null → same as rollout_batch_size
train_batch_size: null
shuffle_buffer_size: 128
gradient_accumulation_steps: 8
learning_rate: 0.000005
max_grad_norm: 1.0
epochs: 1
kl_coef: 0.0
clip_ratio: 0.2
clip_ratio_high: 0.28
grpo_std_normalization: true
temperature: 0.9
top_p: 0.95
# colocated HF generate (slime --colocate analogue)
rollout_backend: hf
# slime --apply-chat-template
apply_chat_template: true
require_thinking_trace: true
thinking_instruction: "Show your reasoning in <think>...</think>, then give the final answer."
outcome_reward_weight: 1.0
format_reward_weight: 0.1
process_reward_weight: 0.0
missing_thinking_penalty: 0.0
min_thinking_tokens: 8
gradient_checkpointing: true
use_lora: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
use_8bit_optimizer: false
save_every_steps: 100
log_every_steps: 1
best_checkpoint_dir: checkpoint-best
auto_stop: true
auto_stop_metric: outcome_reward_mean
auto_stop_patience: 20
auto_stop_min_delta: 0.0001
auto_stop_warmup_steps: 10
stop_on_nonfinite: true
write_verifier_data: true
verifier_data_file: slime_verifier_data.jsonl
verifier_max_text_chars: 2048
data_gen: true
data_gen_source: dataset
dataset_ref: open-r1/OpenR1-Math-220k
data_gen_count: 2048
data_gen_filename: slime_generated.jsonl
data_designer: "off"
