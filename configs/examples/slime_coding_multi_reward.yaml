# Portable multi-reward coding RL base config (specialist / multi-domain slime).
#
# Rewards (per sample via reward: multi):
#   - unit_tests      competitive I/O (stdin/stdout)
#   - codebase_tests  multi-file packages judged with pytest
#   - assert_tests    function/library tasks (MBPP / HumanEval style)
#
# Prepare data first:
#   python scripts/prepare_elite_coding_mix.py --out-dir data/elite_coding
#   # or smaller: scripts/generate_synthetic_codebases.py + existing contest JSONL
#
# Train one phase:
#   seiso train -c configs/examples/slime_coding_multi_reward.yaml
#
# Full specialist loop (warm → function → contest → package):
#   python scripts/slime_coding_train_until_good.py --mode specialist \
#     --base-config configs/examples/slime_coding_multi_reward.yaml \
#     --recipe configs/examples/slime_coding_specialist_recipe.yaml \
#     --data-root data/elite_coding

model_id: Qwen/Qwen3-8B
dataset: data/elite_coding/train.jsonl
output_dir: outputs/slime-coding-multi-reward
method: slime
quant: 16bit
dtype: bfloat16
device: cuda
training_methodology: seiso_release_post_training
prompt_field: prompt
answer_field: answer
reward: multi
max_vram_gb: 22.5
max_prompt_tokens: 1536
max_new_tokens: 1024
rollouts_per_prompt: 4
rollout_batch_size: 4
policy_micro_batch_size: 1
batch_size: 1
train_batch_size: 1
shuffle_buffer_size: 256
max_samples_per_epoch: 300
gradient_accumulation_steps: 4
learning_rate: 5.0e-06
max_grad_norm: 1.0
epochs: 1
kl_coef: 0.0
clip_ratio: 0.2
temperature: 1.05
top_p: 0.95
require_thinking_trace: false
thinking_instruction: 'Emit runnable Python.

  - Contest/IO: one ```python block (stdin/stdout).

  - Multi-file packages: ```python path=relative/file.py per target file.

  - Functions/libraries: one ```python block with full definitions.'
outcome_reward_weight: 1.0
process_reward_weight: 0.0
missing_thinking_penalty: 0.0
min_thinking_tokens: 0
gradient_checkpointing: true
slime_use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
use_8bit_optimizer: true
trust_remote_code: true
save_steps: 5
logging_steps: 1
best_checkpoint_dir: checkpoint-best
auto_stop: true
auto_stop_metric: reward_mean
auto_stop_patience: 14
auto_stop_min_delta: 0.01
auto_stop_warmup_steps: 8
auto_stop_ema_alpha: 0.25
sequential_rollouts: true
stop_on_nonfinite: true
write_verifier_data: true
verifier_data_file: slime_verifier_data.jsonl
verifier_max_text_chars: 4096
seed: 17
extra:
  max_steps: 45
  sequential_rollouts: true
