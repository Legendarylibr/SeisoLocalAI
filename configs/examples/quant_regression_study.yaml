# Multi-quant regression study — Qwen 3B on MetaMathQA with HF + llama.cpp eval.
# Run: seiso experiment quant-regression -c configs/examples/quant_regression_study.yaml
# Set LLAMA_CPP_DIR to a llama.cpp checkout for GGUF export / route eval.
model_id: Qwen/Qwen2.5-3B-Instruct
dataset: meta-math/MetaMathQA
output_dir: ~/.seiso/experiments/quant-regression-qwen3b-metamath
method: lora
quant: 4bit
dataset_format: alpaca
epochs: 1
batch_size: 1
learning_rate: 0.0002
max_seq_length: 1024
lora_r: 8
lora_alpha: 16
lora_dropout: 0
gradient_accumulation_steps: 4
gradient_checkpointing: true
train_on_responses_only: true
use_triton: true
use_fused_ce: true
use_fused_lora: true
save_safetensors: true
eval_split_ratio: 0.1
save_steps: 100
logging_steps: 10
seed: 42
deterministic: true
extra:
  max_samples: 512
  max_reward_regression: 0.10
  max_perplexity_regression: 0.05
  route_repo_id: local/quant-regression-study
