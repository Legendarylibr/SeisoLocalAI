model_id: /home/c/models/Qwen3-8B
dataset: data/slime_coding_complex/train.jsonl
output_dir: outputs/slime-qwen3-8b-coding-complex
method: slime
quant: 16bit
dtype: bfloat16
device: cuda
training_methodology: seiso_release_post_training
prompt_field: prompt
answer_field: answer
# Per-sample: unit_tests (contest) + codebase_tests (multi-file pytest packages)
reward: multi
max_vram_gb: 22.5
max_prompt_tokens: 1536
max_new_tokens: 1024
rollouts_per_prompt: 4
rollout_batch_size: 4
policy_micro_batch_size: 1
batch_size: 1
train_batch_size: 1
shuffle_buffer_size: 256
max_samples_per_epoch: 280
gradient_accumulation_steps: 4
learning_rate: 5.0e-06
max_grad_norm: 1.0
epochs: 1
kl_coef: 0.0
clip_ratio: 0.2
temperature: 1.05
top_p: 0.95
require_thinking_trace: false
thinking_instruction: For contest problems, provide a single ```python block that reads
  stdin and writes stdout. For multi-file packages, emit one ```python path=... block
  per target file with full file contents.
outcome_reward_weight: 1.0
process_reward_weight: 0.0
missing_thinking_penalty: 0.0
min_thinking_tokens: 0
gradient_checkpointing: true
slime_use_lora: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
use_8bit_optimizer: true
trust_remote_code: true
save_steps: 5
logging_steps: 1
best_checkpoint_dir: checkpoint-best
auto_stop: true
auto_stop_metric: reward_mean
auto_stop_patience: 14
auto_stop_min_delta: 0.01
auto_stop_warmup_steps: 8
auto_stop_ema_alpha: 0.25
sequential_rollouts: true
stop_on_nonfinite: true
write_verifier_data: true
verifier_data_file: slime_verifier_data.jsonl
verifier_max_text_chars: 4096
seed: 17
extra:
  max_steps: 40
  sequential_rollouts: true
