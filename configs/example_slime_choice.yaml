# TEMPLATE — not a ready-to-run recipe. Paths below must exist (or set
# SEISO_ALLOW_TEMPLATE_SLIME=1 to inspect knobs). Hub-backed product math:
# configs/example_training_slime.yaml. CI toys: data/slime_choice_*.jsonl
# via SEISO_ALLOW_TINY_RL=1.
model_id: Qwen/Qwen2.5-0.5B-Instruct
method: slime
# slime path uses full-precision (+ optional LoRA); quant ignored by slime runner
quant: none
# REQUIRED: operator-curated multiple-choice JSONL (not shipped).
dataset: ./data/operator_choice_train.jsonl
eval_dataset: ./data/operator_choice_eval.jsonl
require_held_out_eval: true
output_dir: outputs/slime-choice
prompt_field: prompt
answer_field: answer
reward: choice
max_vram_gb: 16
max_prompt_tokens: 512
max_new_tokens: 128
rollouts_per_prompt: 4
rollout_batch_size: 4
# Drop all-correct / all-wrong groups so GRPO gets nonzero advantages.
dynamic_sampling_filter: reward_nonzero_std
over_sampling_batch_size: 8
# Keep intact GRPO groups: must be a multiple of rollouts_per_prompt.
policy_micro_batch_size: 4
train_batch_size: 1
shuffle_buffer_size: 128
gradient_accumulation_steps: 8
learning_rate: 0.000005
max_grad_norm: 1.0
epochs: 1
# 0 saves VRAM (no ref model). Prefer 0.02–0.05 for multi-epoch / production runs.
kl_coef: 0.0
clip_ratio: 0.2
clip_ratio_high: 0.28
grpo_std_normalization: true
temperature: 0.9
top_p: 0.95
require_thinking_trace: true
thinking_instruction: "Show your reasoning in <think>...</think>, then give the final answer letter."
outcome_reward_weight: 1.0
format_reward_weight: 0.1
process_reward_weight: 0.0
missing_thinking_penalty: 0.0
gradient_checkpointing: true
use_lora: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
save_every_steps: 100
log_every_steps: 1
best_checkpoint_dir: checkpoint-best
auto_stop: true
auto_stop_metric: outcome_reward_mean
auto_stop_patience: 20
write_verifier_data: true
verifier_data_file: slime_verifier_data.jsonl
data_gen: false
data_gen_source: "off"
data_designer: "off"
