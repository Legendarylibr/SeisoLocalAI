model_id: Qwen/Qwen2.5-0.5B-Instruct
# Replace fixtures with a curated verifiable train/eval pair (OpenR1-style).
# Examples: open-r1/OpenR1-Math-220k (map answer fields), or operator JSONL with
# answer/tests. Floors are gates (>=256); real GRPO runs want >>1k-10k+.
dataset: data/slime_sample.jsonl
eval_dataset: data/slime_numeric_eval.jsonl
require_held_out_eval: true
output_dir: outputs/slime-train-method
method: slime
# slime path loads full-precision (+ optional LoRA); quant is ignored by this trainer
quant: none
training_methodology: seiso_release_post_training
prompt_field: prompt
answer_field: answer
metadata_field: metadata
reward: auto
max_vram_gb: 16
max_prompt_tokens: 512
max_new_tokens: 128
rollouts_per_prompt: 4
rollout_batch_size: 2
dynamic_sampling_filter: reward_nonzero_std
over_sampling_batch_size: 4
policy_micro_batch_size: 2
batch_size: 1
train_batch_size: null
shuffle_buffer_size: 128
gradient_accumulation_steps: 8
learning_rate: 0.000005
max_grad_norm: 1.0
epochs: 1
kl_coef: 0.0
clip_ratio: 0.2
clip_ratio_high: 0.28
grpo_std_normalization: true
temperature: 0.9
top_p: 0.95
rollout_backend: hf
apply_chat_template: true
require_thinking_trace: true
thinking_instruction: "Show your reasoning in <think>...</think>, then give the final answer."
outcome_reward_weight: 1.0
format_reward_weight: 0.1
process_reward_weight: 0.0
missing_thinking_penalty: 0.0
min_thinking_tokens: 8
gradient_checkpointing: true
slime_use_lora: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
use_8bit_optimizer: false
save_steps: 100
logging_steps: 1
best_checkpoint_dir: checkpoint-best
auto_stop: true
auto_stop_metric: reward_mean
auto_stop_patience: 20
auto_stop_min_delta: 0.0001
auto_stop_warmup_steps: 10
stop_on_nonfinite: true
write_verifier_data: true
verifier_data_file: slime_verifier_data.jsonl
verifier_max_text_chars: 2048
# Product default: no synth. data/* JSONLs are CI fixtures — replace for real runs.
data_gen: false
data_gen_source: "off"
data_designer: "off"
# Opt-in HF materialize:
# data_gen: true
# data_gen_source: hf_dataset
# hf_dataset: open-r1/OpenR1-Math-220k
# data_gen_count: 2048
# Opt-in Data Designer (pip install -e '.[data-designer]' + running endpoint):
# data_gen: true
# data_gen_source: data_designer
# data_designer: "on"
# vllm_base_url: http://127.0.0.1:8000
# data_gen_count: 400
