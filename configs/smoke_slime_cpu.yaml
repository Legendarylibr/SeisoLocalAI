# CI / agent smoke only — uses committed data/slime_*.jsonl toys.
# Not for meaningful GRPO. Requires SEISO_ALLOW_TINY_RL=1 (pytest conftest sets it).
# Product recipes: configs/example_training_slime.yaml (Hub materialize).
# Tiny CPU smoke for slime GRPO + verifier rewards (no CUDA required).
model_id: hf-internal-testing/tiny-random-LlamaForCausalLM
method: slime
quant: none
dataset: data/slime_sample.jsonl
# Disjoint from train; eval_on_complete left false for speed.
eval_dataset: data/slime_numeric_eval.jsonl
# CI fixture — opt out of product held-out gate (also covered by SEISO_ALLOW_TINY_RL).
require_held_out_eval: false
output_dir: ./.test_outputs/slime-smoke
prompt_field: prompt
answer_field: answer
reward: numeric
device: cpu
dtype: float32
max_prompt_tokens: 64
max_new_tokens: 32
rollouts_per_prompt: 2
rollout_batch_size: 1
over_sampling_batch_size: null
dynamic_sampling_filter: none
# Multiple of rollouts_per_prompt (intact GRPO groups); still needs SEISO_ALLOW_TINY_RL for floors.
policy_micro_batch_size: 2
train_batch_size: 1
shuffle_buffer_size: 8
gradient_accumulation_steps: 1
learning_rate: 0.00001
max_grad_norm: 1.0
epochs: 1
max_steps: 1
kl_coef: 0.0
clip_ratio: 0.2
grpo_std_normalization: true
temperature: 0.8
top_p: 0.95
rollout_backend: hf
apply_chat_template: false
require_thinking_trace: true
thinking_instruction: "Show your reasoning in <think>...</think>, then give the final answer."
outcome_reward_weight: 1.0
format_reward_weight: 0.1
process_reward_weight: 0.0
missing_thinking_penalty: 0.0
min_thinking_tokens: 8
code_reward_mode: binary
gradient_checkpointing: false
use_lora: true
lora_r: 4
lora_alpha: 8
lora_dropout: 0.0
use_8bit_optimizer: false
# 0 is allowed by seiso slime; TrainConfig/seiso train requires >= 1.
save_every_steps: 1
log_every_steps: 1
auto_stop: false
stop_on_nonfinite: true
write_verifier_data: true
verifier_data_file: slime_verifier_data.jsonl
data_gen: false
eval_on_complete: false
seed: 17
