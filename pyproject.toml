[build-system]
requires = ["hatchling", "setuptools>=61"]
build-backend = "hatchling.build"

[project]
name = "seiso"
version = "0.1.0"
description = "Seiso — local AI platform for running, training, and fine-tuning open models"
readme = "README.md"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.10"
authors = [{ name = "Seiso Contributors" }]
keywords = ["llm", "fine-tuning", "lora", "local-ai", "mlx", "gguf"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.14.2",
  "pyyaml>=6.0",
  "safetensors>=0.4",
  "huggingface-hub>=0.32",
  "hf-xet>=0.1.0",
  "numpy>=1.26",
  "tqdm>=4.66",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
train = [
  "torch>=2.12",
  "transformers>=5.10",
  "datasets>=5.0",
  "peft>=0.19",
  "accelerate>=1.13",
  "bitsandbytes>=0.43; platform_system != 'Darwin'",
  "trl>=0.8",
  "kernels>=0.12.0,<0.13",
  "sentence-transformers>=3.0",
  "sentencepiece>=0.2",
]
mlx = [
  "mlx-lm>=0.19; platform_system == 'Darwin'",
]
cuda = [
  "triton>=2.2; platform_system == 'Linux'",
]
# Optional — build from source on Linux NVIDIA; not pulled in by [cuda] (see scripts/install_flash_attn.sh).
flash-attn = [
  "flash-attn>=2.5; platform_system == 'Linux'",
]
# AMD ROCm: install PyTorch ROCm wheel + triton; native .cu kernels are NVIDIA-only.
# Seiso auto-selects Triton on AMD via seiso.kernels.platform.detect_gpu().
forge = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "python-jose[cryptography]>=3.3",
  "bcrypt>=4.1",
  "email-validator>=2.1",
  "aiosqlite>=0.20",
  "sse-starlette>=2.1",
  "cryptography>=42",
]
router = [
  "litellm>=1.55.0",
]
llamacpp = [
  "llama-cpp-python>=0.3",
  "nvidia-cuda-runtime-cu12; platform_system == 'Linux'",
  "nvidia-cublas-cu12; platform_system == 'Linux'",
]
compress-quant = [
  # torch must be present before auto-gptq builds its CUDA extension
  "torch>=2.12",
  "auto-gptq>=0.7.1",
  "autoawq>=0.2.9",
]
compress-eval = [
  "lm-eval[hf]>=0.4.12",
]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy==1.10.1",
  "types-PyYAML>=6.0",
  "pylint>=3.2",
  "bandit[toml]>=1.7",
  "detect-secrets>=1.5",
  "pip-audit>=2.7",
  "pre-commit>=3.7",
  "httpx>=0.27",
  "datasets>=5.0",
]

[project.scripts]
seiso = "seiso_cli.main:app"
seiso-train-worker = "seiso.training.worker:main"
seiso-bench-kernels = "seiso.kernels.benchmark:main"

[project.urls]
Homepage = "https://github.com/Legendarylibr/SeisoLocalAI"
Documentation = "https://github.com/Legendarylibr/SeisoLocalAI#readme"

[tool.hatch.build.targets.wheel]
packages = ["seiso", "seiso_cli", "forge"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["third_party", ".venv", "venv", "forge-ui/dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length; use `ruff format` instead

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "SIM117"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["slow: long-running integration tests"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "seiso.security.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "seiso.ttl_cache"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pylint.main]
py-version = "3.10"
jobs = 0
extension-pkg-allow-list = ["pydantic"]
ignored-modules = [
  "llama_cpp",
  "peft",
  "transformers",
  "torch",
  "mlx_lm",
  "codellama_compress",
  "adaptive_rl_quant",
  "adaptive_quant",
  "sentence_transformers",
  "triton",
  "flash_attn",
  "bitsandbytes",
  "auto_gptq",
  "autoawq",
  "lm_eval",
  "diffusers",
  "onnxruntime",
  "litellm",
]

[tool.pip-audit]
ignore-vulns = ["CVE-2025-3000"]

[tool.pylint.messages_control]
disable = [
  "duplicate-code",
  "cyclic-import",
  "possibly-used-before-assignment",
  "invalid-enum-extension",
  "too-few-public-methods",
  "too-many-arguments",
  "too-many-locals",
  "too-many-branches",
  "too-many-statements",
  "too-many-lines",
  "missing-module-docstring",
  "missing-class-docstring",
  "missing-function-docstring",
  "invalid-name",
  "line-too-long",
  "import-outside-toplevel",
  "fixme",
  "broad-exception-caught",
  "broad-exception-raised",
  "consider-using-f-string",
]

[tool.pylint.format]
max-line-length = 100

[tool.bandit]
exclude_dirs = ["tests", "third_party", ".venv", "venv", "forge-ui"]
skips = [
  "B101",  # assert (tests excluded; remaining uses are dev guards)
  "B404",  # subprocess import — required for training/export orchestration
  "B603",  # subprocess without shell — intentional, args are controlled
  "B607",  # partial executable path — resolves via PATH in controlled env
  "B615",  # HF revision pinning — users pick models/revisions at runtime
  "B108",  # /tmp paths — dev/test sandboxes only in remaining hits
  "B110",  # try/except/pass — used in optional-import fallbacks
  "B112",  # try/except/continue — used in optional-import fallbacks
  "B310",  # urllib open — local file URLs in export paths
]
