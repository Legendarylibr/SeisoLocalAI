[build-system]
# setuptools>=83: CVE-2026-59890 (MANIFEST.in exclusion bypass via Unicode normalization).
requires = ["setuptools>=83", "wheel", "pybind11>=2.13"]
build-backend = "setuptools.build_meta"

[project]
name = "seiso"
version = "0.1.0"
description = "Local-first AI lab: chat, fine-tune, quantize, compress, and deploy open models on your hardware (Forge UI + CLI)"
readme = "README.md"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.10"
authors = [{ name = "Seiso Contributors" }]
keywords = ["llm", "fine-tuning", "lora", "local-ai", "mlx", "gguf"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.14.2",
  "pyyaml>=6.0",
  "safetensors>=0.4",
  "huggingface-hub>=0.32",
  "hf-xet>=0.1.0",
  "numpy>=1.26",
  "tqdm>=4.66",
  "tomli>=2.0; python_version < '3.11'",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
train = [
  # torch>=2.13 required: CVE-2025-3000 (torch.jit.script memory corruption) fixed in 2.13.0
  "torch>=2.13",
  "transformers>=5.10",
  "datasets>=5.0",
  "peft>=0.19",
  "accelerate>=1.13",
  "bitsandbytes>=0.43; platform_system != 'Darwin'",
  "trl>=0.8",
  "kernels>=0.12.0,<0.17",
  "sentence-transformers>=3.0",
  "sentencepiece>=0.2",
]
mlx = [
  "mlx-lm>=0.19; platform_system == 'Darwin'",
]
cuda = [
  "triton>=2.2; platform_system == 'Linux'",
  "ninja>=1.11",
  "cuda-cccl>=1.0; platform_system == 'Linux'",
  # llama-cpp-python CUDA wheels link libcudart.so.12; PyTorch 2.12+ ships cu13 only.
  "nvidia-cuda-runtime-cu12; platform_system == 'Linux'",
  "nvidia-cublas-cu12; platform_system == 'Linux'",
  # cuda-toolkit comes via torch (13.0.x); install.sh upgrades to >=13.1.0 when ptxas is too old.
]
# Optional — build from source on Linux NVIDIA; not pulled in by [cuda] (see scripts/install_flash_attn.sh).
flash-attn = [
  "flash-attn>=2.5; platform_system == 'Linux'",
]
# AMD ROCm: install PyTorch ROCm wheel + triton; native .cu kernels are NVIDIA-only.
# Seiso auto-selects Triton on AMD via seiso.kernels.platform.detect_gpu().
forge = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "python-jose[cryptography]>=3.3",
  # Transitive via python-jose → rsa; floor for REAL/OID DoS (CVE-2026-59885/59886).
  "pyasn1>=0.6.4",
  # No password auth (Nostr nsec→npub). bcrypt unused in code; drop on next full lock refresh.
  "bcrypt>=4.1",
  "email-validator>=2.1",
  "aiosqlite>=0.20",
  "sse-starlette>=2.1",
  "cryptography>=42",
  # Nostr provenance relay I/O (default-on; BIP-340 signing is pure-Python in-tree).
  "websockets>=12",
]
llamacpp = [
  "llama-cpp-python>=0.3",
  "nvidia-cuda-runtime-cu12; platform_system == 'Linux'",
  "nvidia-cublas-cu12; platform_system == 'Linux'",
]
compress-quant = [
  # torch must be present before auto-gptq builds its CUDA extension
  "torch>=2.13",
  "auto-gptq>=0.7.1",
  "autoawq>=0.2.9",
]
compress-eval = [
  "lm-eval[hf]>=0.4.12",
]
# Optional — multi-GPU vLLM slime synth data via NVIDIA NeMo Data Designer.
data-designer = [
  "data-designer>=0.8.0",
]
# Alias kept for docs / explicit installs — same deps as [forge] for relay I/O.
# Forge auth (npub/nsec) needs no extra; provenance attest/verify uses websockets.
nostr = [
  "websockets>=12",
  "cryptography>=42",
]
dev = [
  # Floor for MANIFEST.in exclusion bypass (CVE-2026-59890); also in [build-system].
  "setuptools>=83",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-xdist>=3.6",
  "ruff>=0.4",
  "mypy==2.3.0",
  "types-PyYAML>=6.0",
  "pylint>=3.2",
  "bandit[toml]>=1.7",
  "detect-secrets>=1.5",
  "pip-audit>=2.7",
  "pre-commit>=3.7",
  "httpx>=0.27",
  "datasets>=5.0",
  "websockets>=12",
]

[project.scripts]
seiso = "seiso_cli.main:app"
seiso-train-worker = "seiso.training.worker:main"
seiso-bench-kernels = "seiso.kernels.benchmark:main"

[project.urls]
Homepage = "https://github.com/Legendarylibr/SeisoLocalAI"
Documentation = "https://github.com/Legendarylibr/SeisoLocalAI#readme"

[tool.setuptools.packages.find]
include = ["seiso*", "seiso_cli*", "forge*"]

[tool.setuptools.package-data]
"seiso.adaptive_quant.configs" = ["*.json"]
"seiso.adaptive_quant.native" = ["*.cpp"]
"seiso.adaptive_quant.prompts" = ["*.json"]
"seiso.adaptive_quant.ui.static" = ["*.html", "*.css", "*.js"]
"seiso.kernels.cuda" = ["*.cpp", "*.cu", "*.cuh"]
"seiso.kernels.cuda.include" = ["*.cuh"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "venv", "forge-ui/dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length; use `ruff format` instead

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "SIM117"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "slow: long-running integration tests",
  "gpu: requires a functional GPU and matching runtime/toolkit",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "seiso.security.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "seiso.ttl_cache"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pylint.main]
py-version = "3.10"
jobs = 0
extension-pkg-allow-list = ["pydantic"]
ignored-modules = [
  "accelerate",
  "awq",
  "data_designer",
  "datasets",
  "llama_cpp",
  "peft",
  "transformers",
  "torch",
  "mlx_lm",
  "kernels",
  "psutil",
  "seiso.codellama_compress",
  "adaptive_rl_quant",
  "seiso.adaptive_quant",
  "sentence_transformers",
  "triton",
  "flash_attn",
  "bitsandbytes",
  "auto_gptq",
  "autoawq",
  "lm_eval",
  "diffusers",
  "onnxruntime",
]

[tool.pip-audit]
ignore-vulns = [
  # Historical pip advisory noise still referenced by some audit DBs.
  "PYSEC-2025-194",
  # llama-cpp-python depends on diskcache, but Seiso attaches LlamaRAMCache
  # instead of diskcache's pickle-backed persistent cache. No fixed diskcache
  # release is advertised by pip-audit for this CVE yet.
  "CVE-2025-69872",
  # pip-audit currently flags ecdsa 0.19.2 even though upstream identifies
  # 0.19.2 as the patched release for malformed DER handling.
  "PYSEC-2026-1325",
]

[tool.pylint.messages_control]
disable = [
  "duplicate-code",
  "cyclic-import",
  "possibly-used-before-assignment",
  "invalid-enum-extension",
  "too-few-public-methods",
  "too-many-arguments",
  "too-many-locals",
  "too-many-branches",
  "too-many-statements",
  "too-many-lines",
  "missing-module-docstring",
  "missing-class-docstring",
  "missing-function-docstring",
  "invalid-name",
  "line-too-long",
  "import-outside-toplevel",
  "fixme",
  "broad-exception-caught",
  "broad-exception-raised",
  "consider-using-f-string",
]

[tool.pylint.format]
max-line-length = 100

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv", "forge-ui"]
skips = [
  "B101",  # assert (tests excluded; remaining uses are dev guards)
  "B404",  # subprocess import — required for training/export orchestration
  "B603",  # subprocess without shell — intentional, args are controlled
  "B607",  # partial executable path — resolves via PATH in controlled env
  "B615",  # HF revision pinning — users pick models/revisions at runtime
  "B108",  # /tmp paths — dev/test sandboxes only in remaining hits
  "B311",  # random.Random is used for deterministic ML sampling, not crypto
  "B110",  # try/except/pass — used in optional-import fallbacks
  "B112",  # try/except/continue — used in optional-import fallbacks
  "B310",  # urllib open — local file URLs in export paths
]
