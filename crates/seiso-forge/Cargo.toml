[package]
name = "seiso-forge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Seiso Forge HTTP control plane (Rust / axum)"
repository.workspace = true
rust-version.workspace = true

[lib]
name = "seiso_forge"
path = "src/lib.rs"

[[bin]]
name = "seiso-forge"
path = "src/main.rs"

[dependencies]
seiso-core = { workspace = true }
seiso-crypto = { workspace = true }
seiso-db = { workspace = true }
seiso-jobs = { workspace = true }
seiso-sandbox = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-stream = "0.1"
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
uuid = { workspace = true }
