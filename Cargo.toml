[workspace]
resolver = "2"
members = [
  "crates/seiso-core",
  "crates/seiso-crypto",
  "crates/seiso-sandbox",
  "crates/seiso-protocol",
  "crates/seiso-jobs",
  "crates/seiso-db",
  "crates/seiso-forge",
  "crates/seiso-cli",
]
default-members = ["crates/seiso-forge", "crates/seiso-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/Legendarylibr/SeisoLocalAI"
rust-version = "1.75"

[workspace.dependencies]
seiso-core = { path = "crates/seiso-core" }
seiso-crypto = { path = "crates/seiso-crypto" }
seiso-sandbox = { path = "crates/seiso-sandbox" }
seiso-protocol = { path = "crates/seiso-protocol" }
seiso-jobs = { path = "crates/seiso-jobs" }
seiso-db = { path = "crates/seiso-db" }
aes-gcm = "0.10"
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "process", "io-util", "sync", "time", "fs"] }
tower-http = { version = "0.6", features = ["trace", "fs", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
