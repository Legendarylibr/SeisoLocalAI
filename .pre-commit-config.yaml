# Install: pre-commit install
# Run all: pre-commit run --all-files
repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: local
    hooks:
      - id: changed-quality
        name: changed-file quality checks
        entry: python scripts/run_ci_local.py --changed --skip-install
        language: system
        pass_filenames: false
        stages: [pre-push]
