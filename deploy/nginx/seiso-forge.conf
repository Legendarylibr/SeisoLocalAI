# Seiso Forge — nginx reverse proxy (HTTPS)
#
# 1. Copy to /etc/nginx/sites-available/seiso-forge
# 2. Replace forge.example.com and certificate paths
# 3. ln -s .../sites-available/seiso-forge .../sites-enabled/
# 4. nginx -t && systemctl reload nginx
#
# Match .env: SEISO_TRUST_PROXY=true SEISO_SECURE_COOKIES=true
#             SEISO_CORS_ORIGINS=https://forge.example.com

upstream seiso_forge {
    server 127.0.0.1:8765;
    keepalive 32;
}

server {
    listen 80;
    server_name forge.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name forge.example.com;

    ssl_certificate     /etc/letsencrypt/live/forge.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forge.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 512m;

    location / {
        proxy_pass http://seiso_forge;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # SSE streaming (training, chat, downloads)
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        proxy_connect_timeout 60s;
    }
}
